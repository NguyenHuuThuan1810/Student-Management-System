<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Chi tiết Môn học</title></head>
<body>
<h2>Chi tiết Môn học</h2>
<a href="{{ url_for('course.list_courses') }}">← Quay lại</a>

<table border="1" cellpadding="6">
  <tr><th>Course ID</th>   <td>{{ course.course_id }}</td></tr>
  <tr><th>Tên môn học</th> <td>{{ course.course_name }}</td></tr>
  <tr><th>Số tín chỉ</th>  <td>{{ course.credits }}</td></tr>
  <tr><th>Mô tả</th>       <td>{{ course.description or '—' }}</td></tr>
</table>

<br>
<a href="{{ url_for('course.edit_course', course_id=course.course_id) }}">Sửa</a>
<form method="post" action="{{ url_for('course.delete_course', course_id=course.course_id) }}"
      style="display:inline"
      onsubmit="return confirm('Xoá môn {{ course.course_name }}?')">
  <button type="submit">Xoá</button>
</form>
</body>
</html>
