<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Sửa Môn học</title></head>
<body>
<h2>Sửa Môn học — {{ course.course_id }}</h2>
<a href="{{ url_for('course.view_course', course_id=course.course_id) }}">← Quay lại</a>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<p><b>{{ msg }}</b></p>{% endfor %}
{% endwith %}

<form method="post">
  <p>Tên môn học *: <input type="text" name="course_name" value="{{ course.course_name }}" required></p>
  <p>Số tín chỉ *: <input type="number" name="credits" value="{{ course.credits }}" min="1" max="10" required></p>
  <p>Mô tả: <textarea name="description" rows="3" cols="40">{{ course.description or '' }}</textarea></p>
  <button type="submit">Lưu thay đổi</button>
  <a href="{{ url_for('course.view_course', course_id=course.course_id) }}">Huỷ</a>
</form>
</body>
</html>
