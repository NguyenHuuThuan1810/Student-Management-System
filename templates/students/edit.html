<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa Sinh viên</title>
</head>
<body>

<!-- ==================================================
     Edit Student Form
================================================== -->

<h2>Sửa Sinh viên - {{ student.student_id }}</h2>

<p>
    <a href="{{ url_for('student.view_student', student_id=student.student_id) }}">
        ← Quay lại thông tin sinh viên
    </a>
</p>

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <p><strong>{{ message }}</strong></p>
        {% endfor %}
    {% endif %}
{% endwith %}

<form method="POST">

    <!-- Student ID (Read Only) -->
    <p>
        <label>Student ID:</label><br>
        <input type="text"
               value="{{ student.student_id }}"
               readonly>
    </p>

    <!-- User Account (Read Only) -->
    <p>
        <label>User Account:</label><br>
        <input type="text"
               value="{{ student.user_id }}"
               readonly>
    </p>

    <!-- Class -->
    <p>
        <label>Class:</label><br>
        <select name="class_id">

            <option value="">-- Chưa phân lớp --</option>

            {% for c in classes %}
            <option value="{{ c.class_id }}"
                {% if student.class_id == c.class_id %}
                    selected
                {% endif %}>
                {{ c.class_name }}
            </option>
            {% endfor %}

        </select>
    </p>

    <!-- Full Name -->
    <p>
        <label>Họ và tên *:</label><br>
        <input type="text"
               name="full_name"
               value="{{ student.full_name }}"
               required>
    </p>

    <!-- Gender -->
    <p>
        <label>Giới tính *:</label><br>

        <select name="gender" required>

            <option value="Male"
                {% if student.gender == 'Male' %}
                    selected
                {% endif %}>
                Nam
            </option>

            <option value="Female"
                {% if student.gender == 'Female' %}
                    selected
                {% endif %}>
                Nữ
            </option>

            <option value="Other"
                {% if student.gender == 'Other' %}
                    selected
                {% endif %}>
                Khác
            </option>

        </select>
    </p>

    <!-- Date of Birth -->
    <p>
        <label>Ngày sinh *:</label><br>
        <input type="date"
               name="date_of_birth"
               value="{{ student.date_of_birth }}"
               required>
    </p>

    <!-- Address -->
    <p>
        <label>Địa chỉ:</label><br>
        <input type="text"
               name="address"
               value="{{ student.address or '' }}">
    </p>

    <!-- Phone -->
    <p>
        <label>Số điện thoại:</label><br>
        <input type="text"
               name="phone"
               value="{{ student.phone or '' }}">
    </p>

    <!-- Email -->
    <p>
        <label>Email:</label><br>
        <input type="email"
               name="email"
               value="{{ student.email or '' }}">
    </p>

    <!-- Department -->
    <p>
        <label>Khoa / Ngành:</label><br>
        <input type="text"
               name="department"
               value="{{ student.department or '' }}">
    </p>

    <!-- Buttons -->
    <p>

        <button type="submit">
            Cập nhật sinh viên
        </button>

        <a href="{{ url_for('student.view_student', student_id=student.student_id) }}">
            Huỷ
        </a>

    </p>

</form>

</body>
</html>
